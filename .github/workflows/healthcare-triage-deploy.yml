name: Healthcare Triage - Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'healthcare-triage/src/**'
      - 'healthcare-triage/package.json'
      - 'healthcare-triage/package-lock.json'
      - '.github/workflows/healthcare-triage-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: healthcare-triage
        run: npm ci

      - name: Build
        working-directory: healthcare-triage
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Copy build output to repo root
        run: |
          cp healthcare-triage/dist/bundle.js ./healthcare-triage/bundle.js
          touch ./healthcare-triage/.nojekyll

      - name: Verify build output actually contains this commit
        run: |
          if ! grep -q "${{ github.sha }}" ./healthcare-triage/bundle.js; then
            echo "::error::healthcare-triage/bundle.js does not contain the current commit SHA (${{ github.sha }}) — the build did not actually update, or the copy step silently failed. Refusing to deploy stale content."
            exit 1
          fi
          echo "Verified: healthcare-triage/bundle.js contains commit ${{ github.sha }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add healthcare-triage/index.html healthcare-triage/bundle.js healthcare-triage/.nojekyll
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Auto-deploy: rebuild healthcare-triage from src/TriageCommandCenter.tsx [skip ci]"
            git push
          fi
